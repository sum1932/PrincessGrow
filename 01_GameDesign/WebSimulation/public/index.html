<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디저트 킹덤 - 웹 테스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍰 디저트 킹덤 - 웹 테스트</h1>
      <p class="subtitle">육성 시뮬레이션 테스트 플레이</p>
    </header>

    <main>
      <!-- 시작 화면 -->
      <div id="start-screen" class="screen active">
        <div class="start-panel">
          <h2>새로운 육성 시작</h2>
          <p>6세의 루아를 18세까지 키워 다양한 엔딩을 경험해보세요.</p>
          <button id="btn-start" class="btn btn-primary">게임 시작</button>
        </div>
      </div>

      <!-- 게임 화면 -->
      <div id="game-screen" class="screen">
        <!-- 상태 패널 -->
        <div class="status-panel">
          <div class="status-header">
            <div class="age-info">
              <span class="label">나이</span>
              <span id="age" class="value">6</span>세
              <span id="month" class="value">1</span>월
            </div>
            <div class="turn-info">
              <span class="label">턴</span>
              <span id="turn" class="value">1</span>
              <span class="label">/</span>
              <span>144</span>
            </div>
            <div class="sweets-info">
              <span class="label">💰</span>
              <span id="sweets" class="value">500</span>
            </div>
          </div>

          <!-- 스탯 -->
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-name">❤️ 체력</span>
              <div class="stat-bar">
                <div id="bar-hp" class="stat-fill" style="width: 5%"></div>
              </div>
              <span id="stat-hp" class="stat-value">50</span>
            </div>
            <div class="stat-item">
              <span class="stat-name">✨ 매력</span>
              <div class="stat-bar">
                <div id="bar-charm" class="stat-fill" style="width: 5%"></div>
              </div>
              <span id="stat-charm" class="stat-value">50</span>
            </div>
            <div class="stat-item">
              <span class="stat-name">📚 지능</span>
              <div class="stat-bar">
                <div id="bar-int" class="stat-fill" style="width: 5%"></div>
              </div>
              <span id="stat-int" class="stat-value">50</span>
            </div>
            <div class="stat-item">
              <span class="stat-name">🎨 기품</span>
              <div class="stat-bar">
                <div id="bar-art" class="stat-fill" style="width: 5%"></div>
              </div>
              <span id="stat-art" class="stat-value">50</span>
            </div>
            <div class="stat-item">
              <span class="stat-name">🌟 도덕</span>
              <div class="stat-bar">
                <div id="bar-morality" class="stat-fill" style="width: 5%"></div>
              </div>
              <span id="stat-morality" class="stat-value">50</span>
            </div>
            <div class="stat-item stress">
              <span class="stat-name">😰 스트레스</span>
              <div class="stat-bar stress-bar">
                <div id="bar-stress" class="stat-fill" style="width: 0%"></div>
              </div>
              <span id="stat-stress" class="stat-value">0</span>
            </div>
          </div>

          <!-- NPC 호감도 -->
          <div class="npc-panel">
            <h3>💕 NPC 호감도</h3>
            <div class="npc-grid">
              <div class="npc-item">
                <span class="npc-name">☕ 이노</span>
                <div class="favor-bar">
                  <div id="bar-ino" class="favor-fill" style="width: 15%"></div>
                </div>
                <span id="favor-ino" class="favor-value">30</span>
              </div>
              <div class="npc-item">
                <span class="npc-name">🍪 아이린</span>
                <div class="favor-bar">
                  <div id="bar-aileen" class="favor-fill" style="width: 10%"></div>
                </div>
                <span id="favor-aileen" class="favor-value">20</span>
              </div>
              <div class="npc-item">
                <span class="npc-name">🍵 카일</span>
                <div class="favor-bar">
                  <div id="bar-kyle" class="favor-fill" style="width: 10%"></div>
                </div>
                <span id="favor-kyle" class="favor-value">20</span>
              </div>
              <div class="npc-item">
                <span class="npc-name">🌙 리안</span>
                <div class="favor-bar">
                  <div id="bar-lian" class="favor-fill" style="width: 0%"></div>
                </div>
                <span id="favor-lian" class="favor-value">0</span>
                <span id="lian-status" class="npc-status">(13세 등장)</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 활동 선택 패널 -->
        <div class="actions-panel">
          <h3>📋 활동 선택</h3>
          <div id="actions-list" class="actions-grid">
            <!-- 동적으로 생성됨 -->
          </div>
        </div>

        <!-- 이벤트 로그 -->
        <div class="log-panel">
          <h3>📖 이벤트 로그</h3>
          <div id="event-log" class="log-content">
            <div class="log-entry system">게임을 시작합니다. 루아의 육성을 시작하세요!</div>
          </div>
        </div>
      </div>

      <!-- 엔딩 화면 -->
      <div id="ending-screen" class="screen">
        <div class="ending-panel">
          <h2>🎉 엔딩</h2>
          <div id="ending-content" class="ending-content">
            <!-- 동적으로 생성됨 -->
          </div>
          <button id="btn-restart" class="btn btn-primary">다시 시작</button>
        </div>
      </div>
    </main>

    <footer>
      <p>디저트 킹덤 웹 테스트 서버 | 로컬 개발용</p>
    </footer>
  </div>

  <!-- 대화 모달 (팝업) -->
  <div id="dialogue-modal" class="dialogue-modal hidden">
    <div class="dialogue-backdrop"></div>
    <div class="dialogue-panel">
      <div class="dialogue-container">
        <div class="dialogue-header">
          <span id="dialogue-npc-icon">💬</span>
          <span id="dialogue-npc-name">NPC</span>
        </div>
        <div id="dialogue-content" class="dialogue-content">
          <!-- 대화 텍스트가 여기에 표시됨 -->
        </div>
        <div id="dialogue-choices" class="dialogue-choices hidden">
          <!-- 선택지가 여기에 표시됨 -->
        </div>
        <div class="dialogue-controls">
          <button id="btn-dialogue-next" class="btn btn-primary">다음 ▶</button>
          <button id="btn-dialogue-skip" class="btn btn-secondary">건너뛰기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
